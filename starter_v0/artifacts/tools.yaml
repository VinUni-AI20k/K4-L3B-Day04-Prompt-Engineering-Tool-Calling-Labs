# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# Keep built-in names and supplied evaluation cases unchanged.
# Improve descriptions and compatible schemas. Declare team-built bonus tools
# here and in tools/__init__.py, then test them with team-authored cases.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Ask the user one question and stop. text = missing inventory ID or employee ID. choice + options [production, staging] = environment not clearly production/staging. yes_no = user asked to create a ticket but has not confirmed the CURRENT draft, including when they changed summary/priority/asset_id after an earlier confirmation or said to reuse that old confirmation / not ask again. Put the updated summary/priority/asset_id in question. A short issue phrase such as 'lỗi VPN' is already a valid summary — do not use text to request a longer summary. Do not call inspect_device, lookup_user, check_service_status, or create_ticket in the same turn."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "The question. For ticket confirmation, include the draft summary, priority, and asset_id and ask the user to confirm."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "text = missing inventory/employee ID only; yes_no = confirm a ticket draft (use this for create-ticket requests); choice = pick from options"}
        options: {type: array, default: [], items: {type: string}, description: "Required when response_type is choice, for example production and staging"}
      required: [question, response_type]

  - name: search_kb
    description: "Tìm bài hướng dẫn, cấu hình, xử lý sự cố hoặc tài liệu trong knowledge base nội bộ. Dùng cho yêu cầu how-to/documentation, kể cả khi người dùng nêu một hệ điều hành hoặc nền tảng cụ thể; không dùng để kiểm tra thiết bị live hay trạng thái service. Chọn category theo chủ đề và đặt nội dung cần tìm vào query."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn"}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_service_status
    description: "Read shared service health for VPN, email, SSO, Wi-Fi, or printing. Call only when environment is clearly production or staging. If the user said demo, QA, test, sandbox, or did not name production/staging, call clarify with response_type=choice and options [production, staging] instead. Never map unofficial environment names onto staging or production."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Shared service name from the user"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Pass production or staging only when the user said that word. Do not use the default to guess. demo/QA/test are not valid values."}
      required: [service]

  - name: inspect_device
    description: "Look up one company device by its inventory ID and return stored diagnostics. Call only when the user already provided an ID such as LT-204 or DT-031. If they asked for a person's assigned devices, use lookup_user instead. Never put a device type, English word, or employee ID into asset_id. Never invent LT-/DT- from an EMP- ID."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Exact inventory ID copied from the user (LT|DT|MB|PR|RM plus hyphen and digits). Not 'laptop', not a person, not EMP-…"}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Always pass this field. all = overall; network = Wi-Fi/network; vpn = VPN; otherwise security, hardware, or software."}
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu hồ sơ nhân viên trong directory bằng employee ID. Dùng khi hỏi tài khoản, hồ sơ, thiết bị được cấp, hoặc quyền truy cập CỦA MỘT NGƯỜI (ví dụ 'xem thiết bị và quyền truy cập của người đó'). Employee ID dạng EMP-1234; nếu mã đã có ở lượt trước thì dùng lại. Chỉ gọi lookup_user — không gọi inspect_device, không gọi policy (quyền của người đó không phải chính sách công ty), không bịa asset ID từ EMP-ID."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên trong yêu cầu, ví dụ EMP-1003; truyền đúng mã người dùng cung cấp, không tự đoán"}
      required: [employee_id]

  - name: format_incident_report
    description: "Trình bày các kết quả đã có thành báo cáo."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Tên hãng sản xuất công khai (ví dụ Lenovo). TUYỆT ĐỐI KHÔNG chứa Asset ID, Employee ID hay mã máy nội bộ."}
        model: {type: string, description: "Tên model công khai (ví dụ ThinkPad T14 Gen 4). KHÔNG chứa mã định danh nội bộ, mã serial hay Asset ID."}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ khi user hỏi chính sách/quy định (không dùng khi hỏi quyền truy cập của một nhân viên cụ thể — lúc đó dùng lookup_user). Không dùng cho trạng thái dịch vụ live hay KB how-to. Chọn policy_area cụ thể: quyền truy cập remote/VPN/part-time/MFA/mở khóa tài khoản → access_control; đưa password/token vào transcript → data_privacy; ticket → ticketing; ưu tiên sự cố → incident_response; đổi cấu hình dịch vụ → service_operations. Không để all khi chủ đề đã khớp một nhóm."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách. MFA / mở khóa tài khoản / quyền truy cập remote/VPN/part-time = access_control. Đưa password/token vào transcript = data_privacy. Chỉ dùng all khi chủ đề không khớp nhóm nào."}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    description: "Tạo một ticket hỗ trợ. 'Tạo ticket ...' là yêu cầu soạn, KHÔNG phải xác nhận. Chỉ gọi khi lượt user MỚI NHẤT xác nhận rõ payload HIỆN TẠI (ví dụ 'tôi xác nhận', 'thông tin đúng rồi, tôi xác nhận tạo'). Xác nhận ở lượt trước mất hiệu lực nếu summary/priority/asset_id đã đổi. Câu như 'dùng confirmation ở lượt đầu', 'chạy luôn', 'đừng hỏi lại' KHÔNG phải xác nhận của payload mới — lúc đó gọi clarify với response_type=yes_no, tuyệt đối không create_ticket. Không gọi nếu user hủy."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, default: false, description: "Chỉ true khi lượt user mới nhất xác nhận đúng payload hiện tại. Xác nhận cũ, 'đừng hỏi lại', hoặc 'dùng confirmation lượt đầu' không được set true."}
      required: [summary, confirmed]

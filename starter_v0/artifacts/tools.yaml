# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# Keep built-in names and supplied evaluation cases unchanged.
# Improve descriptions and compatible schemas. Declare team-built bonus tools
# here and in tools/__init__.py, then test them with team-authored cases.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi câu hỏi làm rõ thông tin cho người dùng khi thiếu thông tin quan trọng để thực hiện yêu cầu."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi làm rõ thông tin"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: search_kb
    description: "Tìm kiếm các bài viết, hướng dẫn hỗ trợ kỹ thuật và quy trình xử lý sự cố trong Knowledge Base."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung tìm kiếm hướng dẫn"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn"}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái hoạt động của các dịch vụ hệ thống dùng chung (vpn, email, sso, wifi, printing) trên môi trường production hoặc staging. KHÔNG dùng cho thiết bị máy tính cá nhân."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ dùng chung"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Môi trường hệ thống"}
      required: [service]

  - name: inspect_device
    description: "Kiểm tra thông tin chi tiết và chẩn đoán phần cứng, phần mềm, mạng hoặc bảo mật trên một thiết bị máy tính cá nhân cụ thể qua mã tài sản asset_id."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản thiết bị (ví dụ LT-101, DS-202)"}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Nhóm kiểm tra"}
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu thông tin danh bạ nhân viên, tài khoản và danh sách thiết bị được bàn giao qua employee_id."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên (ví dụ EMP-101)"}
      required: [employee_id]

  - name: format_incident_report
    description: "Tổng hợp và trình bày các kết quả đã thu thập từ các tool thành một báo cáo sự cố chuẩn hóa."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả thu thập được"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề sự cố"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tra cứu các quy định, chính sách IT nội bộ công ty (quy định cấp thiết bị, quy trình ticketing, quy định bảo mật, làm việc từ xa)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung quy định cần tra cứu"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    description: "Tạo một ticket hỗ trợ sự cố mới trên hệ thống IT Helpdesk. CHỈ gọi công cụ này sau khi người dùng đã đưa ra xác nhận rõ ràng."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, default: false, description: "Đã được người dùng xác nhận hay chưa"}
      required: [summary]


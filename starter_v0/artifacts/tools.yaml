# Hospital AMR Operations Assistant — v0 first-draft declarations.
# Descriptions are intentionally short. Routing guidance, ID format hints and
# confirmation boundaries are improved from eval evidence in v1/v2/v3.
#
# Names, parameters and enums follow docs/AMR_TOOL_CONTRACT.md and must match
# tools/__init__.py. The original IT Helpdesk declarations are kept in
# artifacts/reference/tools_it_helpdesk.yaml.
tools:
  - name: clarify
    description: "Gửi một câu hỏi cho operator."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: get_robot_status
    description: "Xem trạng thái một robot."
    parameters:
      type: object
      properties:
        robot_id: {type: string, description: "Mã robot"}
        check: {type: string, enum: [all, location, battery, errors, mission], default: "all", description: "Thông tin cần xem"}
      required: [robot_id]

  - name: list_robots
    description: "Liệt kê robot."
    parameters:
      type: object
      properties:
        status: {type: string, enum: [all, idle, on_mission, charging, error], default: "all", description: "Trạng thái"}
        min_battery: {type: integer, default: 0, description: "Pin tối thiểu"}
      required: []

  - name: get_location_info
    description: "Xem thông tin một địa điểm trong bệnh viện."
    parameters:
      type: object
      properties:
        location_id: {type: string, enum: [LAB_B, PHARMACY, ER, WARD_3A, ICU, OR_1, DOCK_1], description: "Mã địa điểm"}
      required: [location_id]

  - name: get_route_info
    description: "Xem tuyến đường của robot."
    parameters:
      type: object
      properties:
        robot_id: {type: string, description: "Mã robot"}
        destination_id: {type: string, enum: [LAB_B, PHARMACY, ER, WARD_3A, ICU, OR_1, DOCK_1], description: "Điểm đến"}
      required: [robot_id, destination_id]

  - name: dispatch_mission
    description: "Gửi robot thực hiện một mission."
    parameters:
      type: object
      properties:
        robot_id: {type: string, description: "Mã robot"}
        destination_id: {type: string, enum: [LAB_B, PHARMACY, ER, WARD_3A, ICU, OR_1, DOCK_1], description: "Điểm đến"}
        mission_type: {type: string, enum: [delivery, pickup, return_to_base], default: "delivery", description: "Loại mission"}
        priority: {type: string, enum: [normal, urgent], default: "normal", description: "Mức ưu tiên"}
        confirmed: {type: boolean, default: false, description: "Đã được xác nhận"}
      required: [robot_id, destination_id]

  - name: cancel_mission
    description: "Hủy một mission."
    parameters:
      type: object
      properties:
        mission_id: {type: string, description: "Mã mission"}
        confirmed: {type: boolean, default: false, description: "Đã được xác nhận"}
      required: [mission_id]

# PC Seller Assistant - v0 baseline declarations (intentionally incomplete).
# This is the starting point students improve through v1/v2/v3: routing
# guidance, argument conventions, missing-information handling, confirmation
# boundaries and data-privacy rules. Keep tool names identical to the registry
# in tools/__init__.py and to the eval datasets.
tools:
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: search_catalog
    description: "Tìm linh kiện hoặc máy dựng sẵn trong catalog."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, cpu, mainboard, ram, gpu, storage, psu, case, cooler, monitor, peripheral, prebuilt], default: "all", description: "Nhóm sản phẩm"}
        use_case: {type: string, enum: [all, gaming, office, workstation, streaming, home], default: "all", description: "Nhu cầu sử dụng"}
        budget_max: {type: integer, default: 0, description: "Ngân sách tối đa (USD)"}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_price
    description: "Kiểm tra giá hiện tại của một SKU."
    parameters:
      type: object
      properties:
        sku: {type: string, description: "Mã sản phẩm"}
        include_stock: {type: boolean, default: true, description: "Kèm tồn kho"}
      required: [sku]

  - name: check_compatibility
    description: "Kiểm tra tính tương thích giữa các linh kiện."
    parameters:
      type: object
      properties:
        cpu_sku: {type: string, default: "", description: "SKU CPU"}
        mainboard_sku: {type: string, default: "", description: "SKU mainboard"}
        ram_sku: {type: string, default: "", description: "SKU RAM"}
        gpu_sku: {type: string, default: "", description: "SKU GPU"}
        psu_sku: {type: string, default: "", description: "SKU nguồn"}
        case_sku: {type: string, default: "", description: "SKU vỏ máy"}
        cooler_sku: {type: string, default: "", description: "SKU tản nhiệt"}
        use_case: {type: string, enum: [all, gaming, office, workstation, streaming, home], default: "all", description: "Nhu cầu sử dụng"}
      required: []

  - name: lookup_customer
    description: "Tra cứu khách hàng trong hệ thống."
    parameters:
      type: object
      properties:
        customer_id: {type: string, description: "Mã khách hàng"}
      required: [customer_id]

  - name: format_quote
    description: "Trình bày các kết quả đã có thành báo giá."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              price: {type: number}
        template: {type: string, enum: [brief, detailed, invoice], default: "brief", description: "Mẫu báo giá"}
        quote_title: {type: string, default: "PC quote", description: "Tiêu đề"}
      required: [findings, template]

  - name: policy
    description: "Tìm trong chính sách của cửa hàng."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, warranty, return, payment, shipping, pricing, privacy, assembly], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_order
    description: "Tạo một đơn mua máy hoặc linh kiện."
    parameters:
      type: object
      properties:
        items: {type: array, default: [], items: {type: string}, description: "Danh sách SKU"}
        customer_id: {type: string, default: "", description: "Mã khách hàng"}
        delivery_option: {type: string, enum: [standard, express], default: "standard", description: "Kiểu giao hàng"}
        confirmed: {type: boolean, default: false, description: "Đã được người dùng xác nhận"}
      required: [items, customer_id]

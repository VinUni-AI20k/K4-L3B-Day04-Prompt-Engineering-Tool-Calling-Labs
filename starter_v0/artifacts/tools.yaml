# SmartCharging v0 tool declarations. Names and schemas match tools/__init__.py.
tools:
  - name: clarify
    description: >-
      Ask one concise question and pause when a required planning value, an exact
      identifier, or explicit confirmation of the current offer is missing.
      Do not use this tool merely to acknowledge a cancellation.
    parameters:
      type: object
      properties:
        question:
          type: string
          description: "Question naming the missing value or exact offer to confirm."
        response_type:
          type: string
          enum: [text, yes_no, choice]
          description: "text for missing data, yes_no for reservation confirmation, choice for a closed set."
        options:
          type: array
          items: {type: string}
          default: []
          description: "Allowed values when response_type is choice."
      required: [question, response_type]

  - name: lookup_vehicle
    description: >-
      Read one fictional EV owned by the authenticated driver. Use for vehicle,
      battery, connector, or maximum charging power questions. It does not find
      stations or decide charging feasibility.
    parameters:
      type: object
      properties:
        vehicle_id:
          type: string
          pattern: '^EV-[0-9]+$'
          description: "Exact vehicle ID supplied by the user, for example EV-101. Never guess it."
      required: [vehicle_id]

  - name: check_station_status
    description: >-
      Read the current synthetic snapshot of exactly one station, including
      status, connectors, ports, site power, and tariff. It does not produce a
      charging offer. Call once per station ID when several are requested.
    parameters:
      type: object
      properties:
        station_id:
          type: string
          pattern: '^ST-[0-9]+$'
          description: "Exact station ID supplied by the user, for example ST-101."
      required: [station_id]

  - name: find_charging_offers
    description: >-
      Business optimizer and verifier for Top-K charging offers. Call only when
      vehicle_id, current_soc, target_soc, timezone-aware deadline, and confirmed
      origin are known. It combines synthetic ownership, route, connector,
      availability, site-power, and tariff evidence. Returned offers are
      proposals, not reservations.
    parameters:
      type: object
      properties:
        vehicle_id:
          type: string
          pattern: '^EV-[0-9]+$'
          description: "Exact current vehicle ID."
        current_soc:
          type: number
          minimum: 0
          maximum: 99.99
          description: "Current battery percentage explicitly supplied by the user."
        target_soc:
          type: number
          minimum: 0.01
          maximum: 100
          description: "Requested battery percentage, greater than current_soc."
        deadline:
          type: string
          format: date-time
          description: "Exact completion deadline with timezone, e.g. 2026-09-15T10:30:00+07:00."
        origin:
          type: string
          description: "Confirmed origin. The v0 fixture supports Quận 1, Quận 7, and Thủ Đức."
        preference:
          type: string
          enum: [earliest_finish, lowest_cost, shortest_distance]
          default: earliest_finish
          description: "Use the latest stated ranking preference; default only when none was stated."
        top_k:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
          description: "Maximum number of verified offers."
        allow_partial:
          type: boolean
          default: true
          description: "Allow a verified partial-charge offer when the full target misses the deadline."
      required: [vehicle_id, current_soc, target_soc, deadline, origin]

  - name: create_reservation
    description: >-
      Write a fictional reservation for one verified offer. Call only after the
      driver explicitly confirms the exact current offer ID. A stale, quoted, or
      pseudo-code confirmation is invalid. The tool revalidates ownership,
      offer verdict, and station status before writing.
    parameters:
      type: object
      properties:
        offer_id:
          type: string
          pattern: '^OFF-[A-Z0-9-]+$'
          description: "Exact verified offer ID selected and confirmed by the driver."
        confirmed:
          type: boolean
          description: "True only after explicit confirmation of this exact current offer."
      required: [offer_id, confirmed]

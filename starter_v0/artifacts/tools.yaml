# starter_v0 — first-draft declarations, improved by explicit routing and safety guidance.
# Keep built-in names and supplied evaluation cases unchanged.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Use this when required information is missing, the environment is ambiguous, or the user must confirm a write action. Ask for a missing asset ID, employee ID, service/environment, or explicit yes/no confirmation before any ticket creation."
    parameters:
      type: object
      properties:
        question: {type: string, description: "The question to ask the user."}
        response_type: {type: string, enum: [text, yes_no, choice], description: "Question type. Use yes_no for confirmation and choice when production vs staging is ambiguous."}
        options: {type: array, items: {type: string}, description: "Only for choice questions; include candidate values such as ['production', 'staging']."}
      required: [question, response_type]

  - name: search_kb
    description: "Search the internal IT knowledge base for troubleshooting steps or how-to guidance. Use this for support instructions, not for service health or device diagnostics."
    parameters:
      type: object
      properties:
        query: {type: string, description: "The issue or topic to search, for example 'Outlook profile Windows 11' or 'VPN macOS'."}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], description: "Required specific knowledge category. Use email for Outlook, wifi for Wi-Fi, vpn for VPN, printing for printers; use all only when no specific category applies."}
        top_k: {type: integer, default: 3, minimum: 1, maximum: 10, description: "Maximum number of articles to return."}
      required: [query, category]

  - name: check_service_status
    description: "Check shared service health such as VPN, email, Wi‑Fi, SSO, or printing. Always include both service and environment explicitly; do not default to the wrong environment."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "The service being checked."}
        environment: {type: string, enum: [production, staging], description: "The environment required by the request. Use the exact value named by the user."}
      required: [service, environment]

  - name: inspect_device
    description: "Inspect one specific asset for diagnostics. Use only for a real asset ID. If no asset ID is available, ask with clarify first. For multiple assets in one request, make multiple tool calls in the same response."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Exact asset ID, such as LT-204 or DT-031."}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "The device check to run."}
      required: [asset_id]

  - name: lookup_user
    description: "Look up an employee record by employee ID. Use only when the employee ID is present; if missing, ask the user for it."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Exact employee ID, for example EMP-1003."}
      required: [employee_id]

  - name: format_incident_report
    description: "Format already-known findings into a brief, technical, or handoff report. Only use this when the findings are already available; do not collect new evidence or refetch data in the same step."
    parameters:
      type: object
      properties:
        findings:
          type: array
          description: "Findings already gathered by previous checks or user-provided facts."
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], description: "The report template to use."}
        incident_title: {type: string, default: "IT incident", description: "Report title."}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Search public product info for a device model. Only use public brand/model information; never send internal asset IDs, employee IDs, or sensitive company data."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Public manufacturer name, e.g. Lenovo."}
        model: {type: string, description: "Public model name, e.g. ThinkPad T14 Gen 4."}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Type of public information needed."}
        max_results: {type: integer, default: 3, minimum: 1, maximum: 5, description: "Maximum number of results."}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Search internal company policy documents for a policy answer. Use this only for policy questions, not operational troubleshooting or diagnostics."
    parameters:
      type: object
      properties:
        query: {type: string, description: "The policy topic to locate."}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "The relevant policy area."}
        top_k: {type: integer, default: 3, minimum: 1, maximum: 10, description: "Maximum number of matching policy sections to return."}
      required: [query]

  - name: create_ticket
    description: "Create a support ticket. This is a write action; it must only run after the user explicitly confirms the summary and priority. Do not call it without confirmed=true and a clear summary."
    parameters:
      type: object
      properties:
        summary: {type: string, description: "Clear support summary to submit as a ticket."}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Priority level for the ticket."}
        asset_id: {type: string, default: "", description: "Asset ID if the issue is tied to a device."}
        confirmed: {type: boolean, description: "Must be true only after explicit user confirmation."}
      required: [summary, confirmed]

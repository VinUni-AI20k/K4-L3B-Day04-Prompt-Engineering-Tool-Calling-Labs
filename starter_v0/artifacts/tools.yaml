tools:
  - name: get_summary
    description: "Xem tổng thu, chi và số dư bằng VND. Dùng period=today, this_week, this_month; hoặc truyền cả start_date và end_date theo YYYY-MM-DD."
    parameters:
      type: object
      properties:
        period: {type: string, enum: [today, this_week, this_month, custom]}
        start_date: {type: string, default: "", description: "Ngày đầu kỳ YYYY-MM-DD; dùng cùng end_date."}
        end_date: {type: string, default: "", description: "Ngày cuối kỳ YYYY-MM-DD; dùng cùng start_date."}
      required: [period]

  - name: get_category_breakdown
    description: "Xem tổng tiền và các giao dịch trong một danh mục của ngày, tuần hoặc tháng hiện tại."
    parameters:
      type: object
      properties:
        period: {type: string, enum: [today, this_week, this_month]}
        category: {type: string, enum: [food, transport, housing, shopping, entertainment, other, salary, other_income]}
      required: [period, category]

  - name: record_transaction
    description: "Ghi một khoản thu hoặc chi bằng VND. Luôn gọi confirmed=false để xem trước; chỉ gọi lại confirmed=true sau khi người dùng xác nhận."
    parameters:
      type: object
      properties:
        type: {type: string, enum: [expense, income]}
        amount: {type: integer, minimum: 1, description: "Số tiền nguyên theo VND."}
        category: {type: string, enum: [food, transport, housing, shopping, entertainment, other, salary, other_income]}
        note: {type: string, default: ""}
        confirmed: {type: boolean, default: false}
      required: [type, amount, category, confirmed]

  - name: clarify
    description: "Hỏi lại đúng một câu khi thiếu dữ liệu hoặc cần người dùng xác nhận thao tác ghi."
    parameters:
      type: object
      properties:
        question: {type: string}
        response_type: {type: string, enum: [yes_no, free_text]}
        missing_fields:
          type: array
          items: {type: string}
          default: []
      required: [question, response_type, missing_fields]

  - name: search_financial_advice
    description: "Tra cứu kiến thức tài chính cơ bản như quy tắc 50/30/20 hoặc quỹ khẩn cấp."
    parameters:
      type: object
      properties:
        topic: {type: string}
      required: [topic]

  - name: budget_forecast_alert
    description: "Dự báo tổng chi cuối tháng và cảnh báo danh mục có nguy cơ vượt ngân sách."
    parameters:
      type: object
      properties:
        month: {type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", description: "Tháng theo YYYY-MM."}
      required: [month]

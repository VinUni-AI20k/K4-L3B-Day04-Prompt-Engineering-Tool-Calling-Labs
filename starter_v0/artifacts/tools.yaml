tools:
  - name: search_products
    description: "Tìm laptop mock theo từ khóa, hãng, ngân sách và nhu cầu."
    parameters:
      type: object
      properties:
        query: {type: string, default: ""}
        brand: {type: string, enum: [all, lenovo, dell, asus, hp, apple, acer], default: all}
        max_price_vnd: {type: integer}
        need: {type: string, enum: [all, study, office, programming, design, gaming], default: all}
      required: []
  - name: get_product_details
    description: "Lấy thông tin và cấu hình laptop mock."
    parameters: {type: object, properties: {product_id: {type: string}}, required: [product_id]}
  - name: check_inventory
    description: "Kiểm tra tồn kho mock theo sản phẩm và chi nhánh."
    parameters:
      type: object
      properties:
        product_id: {type: string}
        branch: {type: string, enum: [district_1, thu_duc, ha_noi]}
      required: [product_id, branch]
  - name: compare_products
    description: "So sánh các laptop có trong catalog mock."
    parameters: {type: object, properties: {product_ids: {type: array, minItems: 2, items: {type: string}}}, required: [product_ids]}
  - name: check_promotion
    description: "Kiểm tra khuyến mãi mock của sản phẩm."
    parameters: {type: object, properties: {product_id: {type: string}}, required: [product_id]}
  - name: search_policy
    description: "Tìm chính sách bảo hành, đổi trả hoặc giao hàng mock."
    parameters:
      type: object
      properties:
        query: {type: string}
        category: {type: string, enum: [all, warranty, returns, shipping], default: all}
      required: [query]
  - name: lookup_customer
    description: "Tra cứu dữ liệu tối thiểu của khách hàng mock."
    parameters: {type: object, properties: {customer_id: {type: string}}, required: [customer_id]}
  - name: get_order_status
    description: "Tra cứu trạng thái đơn hàng mock."
    parameters: {type: object, properties: {order_id: {type: string}}, required: [order_id]}
  - name: create_order
    description: "Tạo đơn mock sau khi khách hàng xác nhận payload mới nhất."
    parameters:
      type: object
      properties:
        customer_id: {type: string}
        product_id: {type: string}
        quantity: {type: integer, minimum: 1}
        branch: {type: string, enum: [district_1, thu_duc, ha_noi]}
        confirmed: {type: boolean, default: false}
      required: [customer_id, product_id, quantity, branch]

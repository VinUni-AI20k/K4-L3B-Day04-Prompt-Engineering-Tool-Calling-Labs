# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# If a tool is renamed, keep the name synchronized across:
#   this file -> tools/__init__.py -> data/eval_base.json
#   -> data/eval_helpdesk_extension.json -> report/demo text
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: search_kb
    description: "Tìm hướng dẫn hỗ trợ kỹ thuật."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn"}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái chung của một dịch vụ dùng chung (VPN, Email...). KHÔNG dùng công cụ này để kiểm tra lỗi trên một thiết bị cá nhân cụ thể."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Môi trường. Nếu user cung cấp môi trường ngoài enum này, phải gọi clarify(choice) thay vì tự chọn."}
      required: [service]

  - name: inspect_device
    description: "Kiểm tra thông tin và chẩn đoán trạng thái (mạng, bảo mật...) trên một thiết bị hoặc tài sản vật lý cụ thể (như laptop, desktop)."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản. Không tự đoán bừa, phải gọi clarify nếu thiếu hoặc không rõ ràng."}
        check: {type: string, enum: [all, network, wifi, vpn, security, hardware, software], default: "all", description: "Nhóm kiểm tra. Dùng network cho WiFi; wifi là alias tương thích."}
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu người dùng trong danh bạ hỗ trợ."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên"}
      required: [employee_id]

  - name: format_incident_report
    description: "Trình bày các kết quả đã có thành báo cáo."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Cấm tuyệt đối truyền asset_id, employee_id, serial, hoặc hostname ra bên ngoài."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo. Không được chứa thông tin nội bộ."}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4. Không được chứa thông tin nội bộ hay asset_id."}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    description: "Tạo một ticket hỗ trợ."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, default: false, description: "Đã được người dùng xác nhận. Chỉ đặt true nếu đã gọi clarify(yes_no). Nếu payload thay đổi, phải hỏi lại."}
      required: [summary]

# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# Keep built-in names and supplied evaluation cases unchanged.
# Improve descriptions and compatible schemas. Declare team-built bonus tools
# here and in tools/__init__.py, then test them with team-authored cases.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại người dùng khi thiếu thông tin bắt buộc (như mã máy asset_id, mã nhân viên employee_id), khi môi trường không rõ ràng, hoặc khi cần xác nhận. Dùng response_type='text' khi yêu cầu cung cấp mã/thông tin thiếu, 'choice' khi cần chọn từ danh sách options, 'yes_no' khi cần xác nhận."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: search_kb
    description: "Tìm hướng dẫn hỗ trợ kỹ thuật."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn"}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái vận hành của một dịch vụ hạ tầng dùng chung toàn công ty (vpn, email, sso, wifi, printing). Không dùng tool này để kiểm tra máy tính cá nhân cụ thể."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Môi trường (chỉ production hoặc staging)"}
      required: [service]

  - name: inspect_device
    description: "Kiểm tra thông tin kỹ thuật và chẩn đoán phần cứng/mạng/bảo mật trên một máy tính cá nhân cụ thể. Bắt buộc phải truyền cả asset_id và nhóm kiểm tra check. Khi kiểm tra tổng thể/toàn diện máy, dùng check='all'."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản (ví dụ: LT-204)"}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Nhóm kiểm tra: 'all' khi kiểm tra tổng thể máy, hoặc domain cụ thể (network, vpn, security, hardware, software)"}
      required: [asset_id, check]

  - name: lookup_user
    description: "Tra cứu thông tin nhân viên và thiết bị được cấp theo employee_id (ví dụ: EMP-1003). Đã bao gồm thiết bị được cấp, không gọi thêm inspect_device khi chỉ tra cứu nhân viên."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên (ví dụ: EMP-1003)"}
      required: [employee_id]

  - name: format_incident_report
    description: "Trình bày các kết quả đã có thành báo cáo."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. CHỈ truyền hãng sản xuất (manufacturer), tên model thương mại công khai (model), và query_type. TUYỆT ĐỐI CẤM truyền số serial, hostname, asset_id, employee_id, địa chỉ IP hay dữ liệu nội bộ ra ngoài web."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo, Dell, Apple"}
        model: {type: string, description: "Tên model thương mại công khai, ví dụ ThinkPad T14 Gen 4, Latitude 5420. Cấm truyền serial, hostname, hoặc asset ID vào đây."}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    description: "Tạo một ticket hỗ trợ kỹ thuật mới. CHỈ GỌI khi người dùng đã xác nhận rõ ràng đồng ý tạo ticket cho nội dung mới nhất (confirmed=True). Nếu là yêu cầu tạo ticket ban đầu, hoặc người dùng đang chỉnh sửa thông tin, hoặc yêu cầu xem lại/hỏi xác nhận, KHÔNG ĐƯỢC GỌI tool này mà phải gọi clarify với response_type='yes_no'."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, default: false, description: "Bắt buộc true khi người dùng đã xác nhận rõ ràng"}
      required: [summary]

  # ---------------- Team-built bonus tool ----------------
  - name: software_catalog
    description: "Tra cứu danh mục phần mềm nội bộ của công ty Northstar Labs để kiểm tra trạng thái phê duyệt (approved, restricted, prohibited), yêu cầu bản quyền (license), phiên bản được duyệt và hướng dẫn cài đặt. Dùng khi người dùng hỏi về việc cài đặt phần mềm, kiểm tra xem một phần mềm có được phép dùng không, hoặc quy trình xin cấp bản quyền phần mềm."
    parameters:
      type: object
      properties:
        software_name: {type: string, description: "Tên phần mềm cần tra cứu (ví dụ: Docker Desktop, VS Code, Wireshark, BitTorrent)"}
        category: {type: string, enum: [all, development, communication, security, collaboration, utilities], default: "all", description: "Nhóm phần mềm"}
      required: [software_name]


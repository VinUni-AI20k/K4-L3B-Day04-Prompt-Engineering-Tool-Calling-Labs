# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# Keep built-in names and supplied evaluation cases unchanged.
# Improve descriptions and compatible schemas. Declare team-built bonus tools
# here and in tools/__init__.py, then test them with team-authored cases.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Ask for missing information or explicit confirmation. State exactly what is needed."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Ask for missing information or explicit confirmation. State exactly what is needed."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Use yes_no before a write action; use choice when selecting an environment or enum value."}
        options: {type: array, default: [], items: {type: string}, description: "Choices for response_type=choice, such as production and staging."}
      required: [question]

  - name: search_kb
    description: "Search internal troubleshooting instructions and how-to articles. Use this for documentation, not live service status or a specific device check."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn"}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_service_status
    description: "Check the current status of one shared service in exactly one environment. Use for production or staging availability; do not use for troubleshooting instructions. If the environment is ambiguous, call clarify first."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Môi trường"}
      required: [service]

  - name: inspect_device
    description: "Inspect one specific device identified by the user. Require the exact asset_id; never invent or infer it. Set check to the requested category instead of defaulting to all when a category is named."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản"}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Nhóm kiểm tra"}
      required: [asset_id]

  - name: lookup_user
    description: "Look up one employee using the exact employee_id. If the ID is missing or ambiguous, call clarify first; never guess an employee ID."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên"}
      required: [employee_id]

  - name: format_incident_report
    description: "Format findings already provided or already collected into a report. Do not call diagnostic or lookup tools again when the user asks only for formatting."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    description: "Create a local support ticket only after explicit confirmation of the current summary, priority, and asset_id. If any detail changes, previous confirmation is invalid and clarify must be called again. Respect cancellation and never set confirmed=true without current confirmation."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, default: false, description: "Đã được người dùng xác nhận"}
      required: [summary]
